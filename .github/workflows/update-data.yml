name: Update XSMN Data

on:
  workflow_dispatch:

  schedule:
    # 18:00 giờ Việt Nam = 11:00 UTC
    - cron: "0 11 * * *"

permissions:
  contents: write

concurrency:
  group: update-xsmm-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update lottery data
        run: node scripts/update-data.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "Auto update XSMN data"

          echo "Fetching latest main..."
          git fetch origin main

          echo "Rebasing data update onto latest main..."
          git rebase origin/main

          echo "Pushing updated data..."
          git push origin HEAD:main
          
