name: Build XSMN Statistics
on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - Build XSMN History
    types:
      - completed

permissions:
  contents: write

jobs:
  build-stats:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Show Node version
        run: node --version

      - name: Build XSMN statistics
        run: node scripts/build-stats.js

      - name: Show generated files
        run: |
          echo "========================================"
          echo "XSMN STATISTICS RESULT"
          echo "========================================"
          ls -lh data/

          echo ""
          echo "===== STATS FILES ====="
          find data -maxdepth 1 -type f -name "*stats*.json" -print || true

      - name: Commit statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No statistics changes to commit."
          else
            git commit -m "Update XSMN statistics"
            git push
          fi
