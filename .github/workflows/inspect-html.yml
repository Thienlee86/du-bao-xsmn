name: Inspect XSMN HTML

on:
  workflow_dispatch:

jobs:
  inspect-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Inspect An Giang HTML
        run: node scripts/inspect-html.js
